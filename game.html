<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame Games</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- GoatCounter analytics (cookieless; auto-skips localhost, so local
         previews aren't counted). Dashboard: https://frame-lang-org.goatcounter.com -->
    <script data-goatcounter="https://frame-lang-org.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="home" href="./">&#9666; Frame Games</a>
      <div class="title-block">
        <h1 id="game-title">&nbsp;</h1>
        <a class="learn-link" href="https://docs.frame-lang.org">Learn about Frame &rarr;</a>
      </div>
    </header>

    <main class="game-layout">
      <section class="play">
        <div class="play-toolbar">
          <div class="version-tabs" id="version-tabs"></div>
          <span class="toolbar-sep" aria-hidden="true">|</span>
          <a class="toolbar-link" href="#fsm-panel"><span class="full">See gameplay &darr;</span><span class="short">Gameplay</span></a>
          <a class="toolbar-link" href="#article"><span class="full">Read article &darr;</span><span class="short">Article</span></a>
        </div>
        <div class="play-stage-row">
          <div id="mobile-controls-left" class="mobile-controls-side" aria-label="Touch controls (left)"></div>
          <div class="play-stage">
            <div id="js-stage" class="stage"></div>
            <div id="godot-stage" class="stage hidden"></div>
          </div>
          <div id="mobile-controls-right" class="mobile-controls-side" aria-label="Touch controls (right)"></div>
        </div>
        <p id="controls" class="controls"></p>
        <div id="mobile-controls" class="mobile-controls" aria-label="Touch controls"></div>
        <div class="resize-handle" id="resize-handle" role="separator" aria-orientation="horizontal" aria-label="Drag to resize the game area" title="Drag to resize the game area">
          <div class="resize-grip"></div>
        </div>
      </section>

      <aside class="fsm fsm-mode-diagram" id="state-machines">
        <div class="fsm-header">
          <h2>Frame Controllers</h2>
          <button class="fsm-mode-toggle" id="fsm-mode-toggle" type="button">Show Code</button>
        </div>
        <div id="fsm-panel"></div>
      </aside>

      <article class="article hidden" id="article"></article>
    </main>

    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
