<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Frame Games</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="home" href="/index.html">&#9666; Frame Games</a>
      <div class="title-block">
        <h1 id="game-title">&nbsp;</h1>
        <p id="game-teaches" class="teaches"></p>
      </div>
    </header>

    <main class="game-layout">
      <section class="play">
        <div class="version-tabs" id="version-tabs"></div>
        <div class="play-stage">
          <div id="js-stage" class="stage"></div>
          <div id="godot-stage" class="stage hidden"></div>
        </div>
        <p id="controls" class="controls"></p>
      </section>

      <aside class="fsm">
        <div class="fsm-header">
          <h2>State machines</h2>
          <button class="popout-btn" id="popout" title="Open the state machines in a separate window">Pop out &#x2197;</button>
        </div>
        <p class="fsm-intro">The controller, exactly as written in Frame. The active state lights up as you play the JavaScript version.</p>
        <div id="fsm-panel"></div>
      </aside>

      <section class="frame-source hidden" id="frame-source">
        <h2>Frame source</h2>
        <p class="source-intro">The <code>.fjs</code> the diagrams above were generated from &mdash; the same file that produces the JS state-machine class via <code>framec</code>.</p>
        <pre><code id="frame-source-code"></code></pre>
      </section>

      <article class="article hidden" id="article"></article>
    </main>

    <script type="module" src="/src/game.ts"></script>
  </body>
</html>
