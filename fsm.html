<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>State machines &mdash; Frame Games</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="fsm-page-body">
    <header class="topbar">
      <div class="title-block">
